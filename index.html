<!DOCTYPE html>
<html lang="he" dir="rtl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>התחש</title>
<style>
:root{--ground:#ffd3c4;--wall:#e8735f;--floor:#ffc2ae;--ink:#963b23;--soft:#b14a37;--shade:#efb4a2;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);font-family:'Rubik','Heebo','Arial Hebrew',Arial,system-ui,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c,#fx{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block}
#fx{pointer-events:none;z-index:1}
.hidden{display:none!important}
button{font:inherit}

/* image buttons from the kit */
.ibtn{width:64px;height:66px;border:0;padding:0;background:none;cursor:pointer;filter:drop-shadow(0 6px 8px rgba(120,55,30,.25));transition:transform .1s}
.ibtn img,.wbtn img{width:100%;height:100%;display:block;pointer-events:none}
.ibtn:active{transform:translateY(3px) scale(.96)}
.ibtn:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:50%}
.ibtn.small{width:48px;height:50px}
.ibtn.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.wbtn{display:block;width:min(64vw,240px);aspect-ratio:220/56;margin:0 auto;border:0;padding:0;background:none;cursor:pointer;transition:transform .1s;filter:drop-shadow(0 5px 6px rgba(120,55,30,.18))}
.wbtn:active{transform:translateY(3px) scale(.98)}
.wbtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:16px}
.wbtn.off{opacity:.45;pointer-events:none}

/* screens */
.screen{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;background:radial-gradient(120% 80% at 50% 30%,#fff1ea 0%,var(--ground) 60%)}
.corner{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px}

/* home */
#home{justify-content:center;gap:10px;padding:0 20px}
.logo{position:relative;width:220px;height:170px;margin-bottom:8px}
.pit{position:absolute;inset:0;border-radius:6px;background:var(--floor);
  box-shadow:inset 0 14px 0 var(--wall),inset 10px 0 0 var(--wall),inset -10px 0 0 var(--wall),inset 0 -6px 0 var(--wall),0 0 0 8px var(--ground),0 0 0 13px #fff,0 18px 30px rgba(140,50,25,.18)}
.body{position:absolute;background:#f6ac1e;box-shadow:0 6px 0 #c9790c}
.b1{left:40px;top:96px;width:150px;height:46px}
.b2{left:144px;top:34px;width:46px;height:108px}
.headc{position:absolute;left:24px;top:84px;width:62px;height:62px;background:#f5a81c;box-shadow:0 7px 0 #c9790c;animation:bob 2.4s ease-in-out infinite}
.headc img{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{margin:22px 0 0;font-size:68px;line-height:1;font-weight:900;color:var(--ink);letter-spacing:-1px;
  text-shadow:0 4px 0 #fff3d8,0 8px 0 var(--shade)}
.tag{margin:6px 0 22px;font-size:17px;font-weight:600;color:var(--soft)}
.stack{display:flex;flex-direction:column;gap:12px}

/* level map */
#map{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;padding:max(18px,env(safe-area-inset-top)) 16px 24px;box-sizing:border-box}
.maphead{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.maphead .ttl{text-align:center;flex:1}
.wname{font-size:26px;font-weight:900;color:var(--ink)}
.wsub{font-size:14px;font-weight:600;color:var(--soft);margin-top:2px}
.spacer{width:48px}
.wprog{width:min(72vw,300px);margin:6px 0 16px}
.levels{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.levels .wbtn{width:min(62vw,230px)}
.worldnav{display:flex;gap:12px;direction:ltr}
.worldnav .wbtn{width:min(42vw,170px)}

/* game HUD */
.top{position:fixed;top:max(22px,env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:2}
.kbar{width:min(calc(100vw - 150px),300px);height:auto;display:block;filter:drop-shadow(0 3px 4px rgba(120,55,30,.2))}
#fill{transition:x .25s ease-out,width .25s ease-out}
.lvl{font-size:14px;font-weight:700;color:var(--soft)}
.pausebtn{position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;z-index:2}
.bottom{direction:ltr;position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:34px;z-index:2}
.hintline{position:fixed;left:0;right:0;bottom:calc(max(28px,env(safe-area-inset-bottom)) + 80px);text-align:center;font-size:15px;font-weight:600;color:var(--soft);padding:0 20px;pointer-events:none;z-index:2}

/* dialogs */
.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(120,45,20,.32)}
.card{position:relative;background:linear-gradient(#fff3d8,#ffe2bd);color:var(--ink);border-radius:28px;padding:28px 22px 24px;max-width:330px;width:100%;text-align:center;
  box-shadow:0 0 0 3px #fff6e6 inset,0 8px 0 #c88058,0 18px 34px rgba(120,45,20,.32)}
.card h2{margin:0 0 6px;font-size:30px;font-weight:900}
.card p{margin:0 0 18px;color:#a0603e;font-size:16px;line-height:1.5}
.card .stack{gap:10px}
.card .x{position:absolute;top:-18px;left:-14px}
.rows{display:flex;flex-direction:column;gap:12px;margin:8px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.55);border-radius:18px;padding:8px 18px 8px 10px;font-size:19px;font-weight:800}
.row .ibtn{width:52px;height:54px}
.steps{text-align:right;margin:4px 0 18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.45;color:#7a3418}
.steps b{flex:none;width:28px;height:28px;border-radius:50%;background:#f5a626;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
@media (prefers-reduced-motion: reduce){.ibtn.pulse,.headc{animation:none}#fill{transition:none}}
</style>

function enclosedHoles(){const st=[[-1,-1]],seen=new Set([K(-1,-1)]),out=new Set();

const PX=96;
function regionPath(c,list,set,pad,ox,oy){
  for(const [x,y] of list){const px=ox+x*PX,py=oy+y*PX;
    c.rect(px-pad,py-pad,PX+2*pad,PX+2*pad);
    if(set.has(K(x+1,y)))c.rect(px+PX/2,py-pad,PX,PX+2*pad);
    if(set.has(K(x,y+1)))c.rect(px-pad,py+PX/2,PX+2*pad,PX);
    if(set.has(K(x+1,y))&&set.has(K(x,y+1))&&set.has(K(x+1,y+1)))c.rect(px+PX/2,py+PX/2,PX,PX);}}

  const isWall=(x,y)=>!cells.has(K(x,y)),used=new Set();
  for(let y=-1;y<=rows;y++)for(let x=-1;x<=cols;x++){
    if(!isWall(x,y)||used.has(K(x,y)))continue;
    let w=1;while(x+w<=cols&&isWall(x+w,y)&&!used.has(K(x+w,y)))w++;
    let h=1;outer:while(y+h<=rows){for(let i=0;i<w;i++)if(!isWall(x+i,y+h)||used.has(K(x+i,y+h)))break outer;h++;}
    for(let j=0;j<h;j++)for(let i=0;i<w;i++)used.add(K(x+i,y+j));
    const [wx,wz]=toWorld(x+(w-1)/2,y+(h-1)/2);
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,DEPTH,h),wallMats);m.position.set(wx,-DEPTH/2,wz);m.castShadow=true;m.receiveShadow=true;level.add(m);}

  gr.addColorStop(0,P.floor0);gr.addColorStop(1,P.floor1);f.fillStyle=gr;f.fillRect(0,0,fc.width,fc.height);
  const mk=document.createElement('canvas');mk.width=fc.width;mk.height=fc.height;const mc=mk.getContext('2d');
  mc.fillStyle=P.ao;mc.fillRect(0,0,mk.width,mk.height);mc.globalCompositeOperation='destination-out';mc.beginPath();regionPath(mc,list,cells,0,PX,PX);mc.fill();

  const floor=new THREE.Mesh(new THREE.PlaneGeometry(cols+2,rows+2),new THREE.MeshStandardMaterial({map:ft,roughness:0.95}));

  d.globalCompositeOperation='destination-out';d.beginPath();regionPath(d,all,allSet,gap,mg*PX,mg*PX);d.fill();
  const dt=new THREE.CanvasTexture(dc);dt.colorSpace=THREE.SRGBColorSpace;dt.anisotropy=8;

}

function updateDog(pts,hx,hy,t){
  segPool.forEach(m=>m.visible=false);jointPool.forEach(m=>m.visible=false);
  const hp=toWorld(hx,hy),chain=pts.map(p=>toWorld(...p)).concat([hp]);let si=0,ji=0;

  G.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='#')cells.add(K(x,y));if(ch==='S')s=[x,y];}));
  holes=enclosedHoles();total=cells.size;path=[s];pathSet=new Set([K(...s)]);hist=[];anim=null;queue=null;won=false;bits=[];hintInfo=null;
  $('title').textContent=levelName(i);$('hint').textContent=i===0?'החליקו את האצבע כדי שהכלב ירוץ':'';
  $('undo').classList.remove('pulse');buildLevel();fit();progress();}
function progress(){const f=path.length/total,w=f>0?Math.max(20,306*f):0,el=$('fill');el.setAttribute('width',w);el.setAttribute('x',313-w);}
const head=()=>path[path.length-1];
function slideCells(d){let [x,y]=head();const out=[];for(;;){const nx=x+D[d][0],ny=y+D[d][1],k=K(nx,ny);if(!cells.has(k)||pathSet.has(k))break;x=nx;y=ny;out.push([x,y]);}return out;}
const blocked=()=>screen!=='game'||!$('paused').classList.contains('hidden')||!$('win').classList.contains('hidden');
function move(d){if(won||blocked())return;if(anim){queue=d;return;}
  const c2=slideCells(d);if(!c2.length){bump={d,t:T()};buzz(8);sfx('bump');return;}
  hist.push(path.length);anim={cells:c2,from:head(),t0:T(),per:0.06,shown:0};sfx('move');
  $('undo').classList.remove('pulse');if(lvl===0)$('hint').textContent='';}
function finishMove(){anim=null;buzz(12);
  if(path.length===total){won=true;celebrate();return;}
  if(D.every((_,d)=>!slideCells(d).length)){$('hint').textContent='הכלב נתקע! בטלו מהלך או התחילו מחדש';$('undo').classList.add('pulse');sfx('stuck');}
  if(queue!==null){const q=queue;queue=null;move(q);}}
function undo(){if(anim||!hist.length||won)return;path=path.slice(0,hist.pop());pathSet=new Set(path.map(p=>K(...p)));progress();$('undo').classList.remove('pulse');$('hint').textContent='';}
let bits=[];
function celebrate(){buzz([30,40,30]);sfx('win');const w=innerWidth,h=innerHeight;
  for(let i=0;i<70;i++)bits.push({x:w/2,y:h*0.45,vx:(Math.random()-0.5)*9,vy:-Math.random()*11-3,s:6+Math.random()*7,c:['#f6ac1e','#ffffff','#2fb3a4','#e0694c','#ffc744'][i%5],r:Math.random()*6,t:T()});
  if(!isDone(lvl)){save.done.push(lvl);persist();}
  const last=lvl===LEVELS.length-1,worldEnd=(lvl+1)%WORLD_SIZE===0;
  setTimeout(()=>{
    if(last){$('winTitle').textContent='סיימתם הכול!';$('winText').textContent='הכלב מילא את כל המבוכים בכל העולמות.';$('next').classList.add('hidden');}
    else if(worldEnd){const w=Math.floor(lvl/WORLD_SIZE);$('winTitle').textContent=`עולם ${w+1} הושלם!`;$('winText').textContent=`עולם ${w+2} · ${WORLDS[w+1]} נפתח בשבילכם.`;
      $('nextImg').src=KIT.next_world;$('next').setAttribute('aria-label','עולם הבא');$('next').classList.remove('hidden');}
    else{$('winTitle').textContent='כל הכבוד!';$('winText').textContent=`${levelName(lvl)} הושלם ב-${hist.length} מהלכים`;
      $('nextImg').src=KIT.next_level;$('next').setAttribute('aria-label','לשלב הבא');$('next').classList.remove('hidden');}
    $('win').classList.remove('hidden');},900);}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

let sw=null;
cv.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY,done:false};});
cv.addEventListener('pointermove',e=>{if(!sw||sw.done)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(Math.hypot(dx,dy)>24){sw.done=true;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));}});
cv.addEventListener('pointerup',()=>{sw=null;});
addEventListener('keydown',e=>{if(screen!=='game')return;const m={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key];if(m!==undefined){e.preventDefault();move(m);}if(e.key==='Backspace')undo();});
$('pause').onclick=()=>{if(!won)$('paused').classList.remove('hidden');};
$('resume').onclick=()=>$('paused').classList.add('hidden');
$('replay2').onclick=()=>{$('paused').classList.add('hidden');load(lvl);};
$('toMap1').onclick=()=>openMap(Math.floor(lvl/WORLD_SIZE));
$('toMap2').onclick=()=>openMap(Math.floor(lvl/WORLD_SIZE));
$('undo').onclick=undo;$('hintBtn').onclick=showHint;$('restart').onclick=()=>load(lvl);
$('next').onclick=()=>{$('win').classList.add('hidden');if(lvl<LEVELS.length-1)load(lvl+1);};

let hintInfo=null;
function solveFrom(){
  const vis=new Set(pathSet);let nodes=0;
  const dfs=pos=>{if(vis.size===total)return[];if(++nodes>300000)return null;
    for(let d=0;d<4;d++){let [x,y]=pos;const add=[];
      for(;;){const nx=x+D[d][0],ny=y+D[d][1],k=K(nx,ny);if(!cells.has(k)||vis.has(k))break;x=nx;y=ny;add.push(k);}
      if(!add.length)continue;add.forEach(k=>vis.add(k));const r=dfs([x,y]);if(r)return[d,...r];add.forEach(k=>vis.delete(k));}
    return null;};
  return dfs(head());}
function showHint(){
  if(anim||won)return;const sol=solveFrom();
  if(!sol){$('hint').textContent='מכאן אין פתרון. בטלו מהלך או התחילו מחדש';$('undo').classList.add('pulse');buzz([20,40,20]);sfx('stuck');return;}
  hintInfo={d:sol[0],t:T()};$('hint').textContent='';buzz(10);sfx('hint');}
function drawHint(t){
  if(!hintInfo)return;const a=t-hintInfo.t;if(a>2.2||anim){hintInfo=null;return;}
  const v=headG.position.clone().project(camera),v2=headG.position.clone().add(new THREE.Vector3(1,0,0)).project(camera);
  const hx=(v.x+1)/2*innerWidth,hy=(1-v.y)/2*innerHeight,cp=Math.abs((v2.x-v.x)/2*innerWidth);
  const [dx,dy]=D[hintInfo.d],bob=Math.sin(a*8)*cp*0.12,dist=cp*0.95+bob,al=Math.min(1,a*5)*Math.min(1,(2.2-a)*3);
  fctx.save();fctx.globalAlpha=al;fctx.translate(hx+dx*dist,hy+dy*dist);fctx.rotate(Math.atan2(dy,dx));
  const s=cp*0.42;fctx.beginPath();fctx.moveTo(s,0);fctx.lineTo(-s*0.2,-s*0.8);fctx.lineTo(-s*0.2,-s*0.32);fctx.lineTo(-s,-s*0.32);fctx.lineTo(-s,s*0.32);fctx.lineTo(-s*0.2,s*0.32);fctx.lineTo(-s*0.2,s*0.8);fctx.closePath();
  fctx.lineJoin='round';fctx.lineWidth=Math.max(3,cp*0.08);fctx.strokeStyle='#b8432a';fctx.fillStyle='#fff6ea';fctx.stroke();fctx.fill();fctx.restore();}
function drawBits(t){fctx.clearRect(0,0,innerWidth,innerHeight);
  for(const p of bits){const a=t-p.t;const x=p.x+p.vx*a*60,y=p.y+p.vy*a*60+0.5*900*a*a;if(y>innerHeight+20)continue;
    fctx.save();fctx.translate(x,y);fctx.rotate(p.r+a*6);fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);fctx.restore();}}
function loop(){
  requestAnimationFrame(loop);
  if(screen!=='game'||!G)return;
  const t=T();let hx,hy;
  if(anim){const e=(t-anim.t0)/anim.per,n=anim.cells.length,k=Math.min(n,Math.floor(e));
    while(anim.shown<k){const c=anim.cells[anim.shown++];path.push(c);pathSet.add(K(...c));progress();}
    if(k>=n){const h=head();hx=h[0];hy=h[1];finishMove();}
    else{const a=k===0?anim.from:anim.cells[k-1],b=anim.cells[k],f=e-k;hx=a[0]+(b[0]-a[0])*f;hy=a[1]+(b[1]-a[1])*f;}
  }else{const h=head();hx=h[0];hy=h[1];}
  updateDog(anim?path:path.slice(0,-1),hx,hy,t);
  renderer.render(scene,camera);drawBits(t);drawHint(t);}

readLocal();refreshHome();readCloud();loop();
</script>
